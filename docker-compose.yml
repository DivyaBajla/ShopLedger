services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shopledger
      POSTGRES_PASSWORD: shopledger
      POSTGRES_DB: shopledger
    ports:
      - "5433:5432"
    volumes:
      - shopledger_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopledger -d shopledger"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://shopledger:shopledger@db:5432/shopledger
      JWT_SECRET: change-this-before-production
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8001/api
    depends_on:
      - backend

volumes:
  shopledger_data: